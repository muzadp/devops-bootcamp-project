global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'devops-bootcamp'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          instance: 'prometheus'

  - job_name: 'web-server-node-exporter'
    static_configs:
      - targets: ['10.0.0.5:9100']
        labels:
          instance: 'web-server'
          role: 'application'
