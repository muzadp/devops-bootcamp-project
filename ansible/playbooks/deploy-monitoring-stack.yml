---
- name: Deploy complete monitoring stack
  hosts: monitoring_servers
  become: yes
  tasks:
    - name: Create Docker network
      docker_network:
        name: monitoring
        state: present

    - name: Create Prometheus directory
      file:
        path: /home/ubuntu/prometheus
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: Copy Prometheus configuration
      copy:
        src: ../prometheus.yml
        dest: /home/ubuntu/prometheus/prometheus.yml
        owner: ubuntu
        group: ubuntu
        mode: '0644'

    - name: Create Prometheus data directory
      file:
        path: /home/ubuntu/prometheus/data
        state: directory
        owner: nobody
        group: nogroup
        mode: '0777'

    - name: Stop existing Prometheus container
      docker_container:
        name: prometheus
        state: absent
      ignore_errors: yes

    - name: Run Prometheus container
      docker_container:
        name: prometheus
        image: prom/prometheus:latest
        state: started
        restart_policy: always
        networks:
          - name: monitoring
        ports:
          - "9090:9090"
        volumes:
          - /home/ubuntu/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
          - /home/ubuntu/prometheus/data:/prometheus
        command:
          - '--config.file=/etc/prometheus/prometheus.yml'
          - '--storage.tsdb.path=/prometheus'
          - '--web.console.libraries=/usr/share/prometheus/console_libraries'
          - '--web.console.templates=/usr/share/prometheus/consoles'
          - '--web.enable-lifecycle'

    - name: Create Grafana directory
      file:
        path: /home/ubuntu/grafana
        state: directory
        owner: "472"
        group: "472"
        mode: '0755'

    - name: Stop existing Grafana container
      docker_container:
        name: grafana
        state: absent
      ignore_errors: yes

    - name: Run Grafana container
      docker_container:
        name: grafana
        image: grafana/grafana:latest
        state: started
        restart_policy: always
        networks:
          - name: monitoring
        ports:
          - "3000:3000"
        volumes:
          - /home/ubuntu/grafana:/var/lib/grafana
        env:
          GF_SECURITY_ADMIN_USER: "admin"
          GF_SECURITY_ADMIN_PASSWORD: "admin123"
          GF_SERVER_ROOT_URL: "https://monitoring.muja-net.com"
          GF_SERVER_SERVE_FROM_SUB_PATH: "false"
          GF_SERVER_DOMAIN: "monitoring.muja-net.com"
